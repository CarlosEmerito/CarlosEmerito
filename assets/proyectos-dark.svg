  <rect x="1" y="1" width="858" height="481" rx="16" fill="#191917" stroke="#44423A" stroke-width="1.5"/>
  <text x="45" y="59" class="" font-size="40">Destacados</text>
  <text x="814" y="53" class="mono muted" text-anchor="end">SELECCIÓN PERSONAL</text>
  <path d="M46 78H814" class="rule" fill="none"/>
  <rect x="46.0" y="91" width="377.00" height="175" rx="11" fill="#242320" stroke="#44423A"/> <rect x="66.0" y="112" width="19" height="4" rx="2" fill="#FF727C"/> <text x="66.0" y="136" class="mono muted" >TECNOLOGÍA EDITORIAL</text> <text x="65.0" y="171" class="" font-size="29">EmeDotEme</text> <text x="66.0" y="198" class="muted" font-size="15">Medio sobre cripto, IA, mercados y</text> <text x="66.0" y="219" class="muted" font-size="15">ciberseguridad. Diseñé el flujo editorial,</text> <text x="66.0" y="240" class="muted" font-size="15">desde las fuentes hasta la publicación.</text> <rect x="437.0" y="91" width="377.00" height="175" rx="11" fill="#242320" stroke="#44423A"/> <rect x="457.0" y="112" width="19" height="4" rx="2" fill="#F4C467"/> <text x="457.0" y="136" class="mono muted" >HERRAMIENTAS DE JUEGO</text> <text x="456.0" y="171" class="" font-size="29">La Taberna de Eme</text> <text x="457.0" y="198" class="muted" font-size="14">Referencia de D&amp;D 5e y 5.5 en español, con</text> <text x="457.0" y="219" class="muted" font-size="14">unas 2.500 fichas, búsqueda y herramientas</text> <text x="457.0" y="240" class="muted" font-size="14">de mesa.</text> <rect x="46.0" y="280" width="377.00" height="175" rx="11" fill="#242320" stroke="#44423A"/> <rect x="66.0" y="301" width="19" height="4" rx="2" fill="#FF727C"/> <text x="66.0" y="325" class="mono muted" >EN DESARROLLO</text> <text x="65.0" y="360" class="" font-size="29">Umami</text> <text x="66.0" y="387" class="muted" font-size="15">Proyecto en el que estoy trabajando con</text> <text x="66.0" y="408" class="muted" font-size="15">qalyBuild.</text> <rect x="437.0" y="280" width="377.00" height="175" rx="11" fill="#242320" stroke="#44423A"/> <rect x="457.0" y="301" width="19" height="4" rx="2" fill="#94A5FF"/> <text x="457.0" y="325" class="mono muted" >CÓDIGO ABIERTO</text> <text x="456.0" y="360" class="" font-size="29">openQomu</text> <text x="457.0" y="387" class="muted" font-size="15">Espacio colaborativo autoalojable de</text> <text x="457.0" y="408" class="muted" font-size="15">qalyBuild con chat, Kanban, documentos y</text> <text x="457.0" y="429" class="muted" font-size="15">archivos en tiempo real.</text>
</svg>
