  <rect x="46.0" y="91" width="246.67" height="217" rx="11" fill="#242320" stroke="#44423A"/> <rect x="66.0" y="112" width="19" height="4" rx="2" fill="#94A5FF"/> <text x="66.0" y="136" class="mono muted" >IA APLICADA</text> <text x="65.0" y="171" class="" font-size="29">OpenExpert</text> <text x="66.0" y="198" class="muted" font-size="14">Panel de IA local-first con</text> <text x="66.0" y="219" class="muted" font-size="14">datos aislados y acciones</text> <text x="66.0" y="240" class="muted" font-size="14">sujetas a aprobación</text> <text x="66.0" y="261" class="muted" font-size="14">humana. Licencia MIT.</text> <rect x="306.67" y="91" width="246.67" height="217" rx="11" fill="#242320" stroke="#44423A"/> <rect x="326.67" y="112" width="19" height="4" rx="2" fill="#FF727C"/> <text x="326.67" y="136" class="mono muted" >TECNOLOGÍA EDITORIAL</text> <text x="325.67" y="171" class="" font-size="29">EmeDotEme</text> <text x="326.67" y="198" class="muted" font-size="14">Medio sobre cripto, IA,</text> <text x="326.67" y="219" class="muted" font-size="14">mercados y ciberseguridad.</text> <text x="326.67" y="240" class="muted" font-size="14">Diseñé el flujo editorial,</text> <text x="326.67" y="261" class="muted" font-size="14">desde las fuentes hasta la</text> <text x="326.67" y="282" class="muted" font-size="14">publicación.</text> <rect x="567.33" y="91" width="246.67" height="217" rx="11" fill="#242320" stroke="#44423A"/> <rect x="587.33" y="112" width="19" height="4" rx="2" fill="#F4C467"/> <text x="587.33" y="136" class="mono muted" >HERRAMIENTAS DE JUEGO</text> <text x="586.33" y="171" class="" font-size="20">La Taberna de Eme</text> <text x="587.33" y="198" class="muted" font-size="14">Referencia de D&amp;D 5e y 5.5</text> <text x="587.33" y="219" class="muted" font-size="14">en español, con unas 2.500</text> <text x="587.33" y="240" class="muted" font-size="14">fichas, búsqueda y</text> <text x="587.33" y="261" class="muted" font-size="14">herramientas de mesa.</text> <rect x="46.0" y="322" width="377.00" height="175" rx="11" fill="#242320" stroke="#44423A"/> <rect x="66.0" y="343" width="19" height="4" rx="2" fill="#FF727C"/> <text x="66.0" y="367" class="mono muted" >EN DESARROLLO</text> <text x="65.0" y="402" class="" font-size="29">Umami</text> <text x="66.0" y="429" class="muted" font-size="15">Proyecto en el que estoy trabajando con</text> <text x="66.0" y="450" class="muted" font-size="15">qalyBuild.</text> <rect x="437.0" y="322" width="377.00" height="175" rx="11" fill="#242320" stroke="#44423A"/> <rect x="457.0" y="343" width="19" height="4" rx="2" fill="#94A5FF"/> <text x="457.0" y="367" class="mono muted" >CÓDIGO ABIERTO</text> <text x="456.0" y="402" class="" font-size="29">openQomu</text> <text x="457.0" y="429" class="muted" font-size="15">Espacio colaborativo autoalojable de</text> <text x="457.0" y="450" class="muted" font-size="15">qalyBuild con chat, Kanban, documentos y</text> <text x="457.0" y="471" class="muted" font-size="15">archivos en tiempo real.</text>
