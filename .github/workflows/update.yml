name: Actualizar perfil editorial

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar la rama predeterminada
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Preparar Python 3.11
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Generar SVG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile.py

      - name: Publicar cambios
        run: |
          git add -- 'assets/*.svg'
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: actualizar gráficos del perfil'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
